{% extends "base.html" %}
{% block title %}Sign in · Times Blitz{% endblock %}
{% block body_class %}centered{% endblock %}
{% block content %}
<main class="auth">
  <div class="brand big"><span class="brand-x">×</span> Times Blitz</div>
  <p class="lead">Fast times tables practice.</p>

  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="sr-only" for="pw">Password</label>
    <div class="field-wrap">
      <input id="pw" name="password" type="password" class="field big" placeholder="Your password"
             autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"
             autofocus required>
      <button type="button" class="reveal" data-reveal="#pw">Show</button>
    </div>
    <button class="btn primary big" type="submit">Let's go</button>
  </form>

  <a class="subtle-link" href="{{ url_for('admin_login') }}">Admin</a>
</main>
{% endblock %}
